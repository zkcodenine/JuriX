<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JuriX</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      /* Fundo com leve brilho dourado central, para dar profundidade. */
      background:
        radial-gradient(120% 90% at 50% 38%, rgba(201,168,76,.10), transparent 60%),
        #08080a;
      color: #fff;
      font-family: 'Segoe UI Variable Display', 'Segoe UI', system-ui, -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      height: 100vh;
      padding: 32px 44px;
      user-select: none;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 0;
    }

    .logo {
      width: 132px;
      height: 132px;
      object-fit: contain;
      /* Sem moldura — só o brilho suave do logo. */
      filter: drop-shadow(0 6px 30px rgba(201,168,76,.35));
      animation: floaty 3.6s ease-in-out infinite;
    }

    @keyframes floaty {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-6px); }
    }

    .title {
      margin-top: 22px;
      font-size: 30px;
      font-weight: 700;
      letter-spacing: 8px;
      color: #c9a84c;
    }

    .subtitle {
      margin-top: 4px;
      font-size: 10.5px;
      color: #6b6b73;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    .progress-wrap {
      margin-top: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 420px;
      max-width: 72vw;
    }

    /* Trilho da barra de progresso. */
    .bar {
      position: relative;
      width: 100%;
      height: 6px;
      border-radius: 999px;
      background: rgba(255,255,255,.07);
      overflow: hidden;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
    }

    /* Preenchimento real — a largura é a porcentagem concluída. */
    .bar-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #8a6f23, #c9a84c 55%, #e7cf84);
      box-shadow: 0 0 14px rgba(201,168,76,.45);
      /* A barra NUNCA volta atrás; só cresce, em movimento suave. */
      transition: width .45s cubic-bezier(.25,.8,.3,1);
    }

    /* Brilho que percorre o trecho já preenchido — indica atividade mesmo
       quando a porcentagem fica parada esperando o backend. */
    .bar-fill::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
      transform: translateX(-100%);
      animation: shimmer 1.8s ease-in-out infinite;
    }

    @keyframes shimmer {
      0%   { transform: translateX(-100%); }
      60%  { transform: translateX(100%); }
      100% { transform: translateX(100%); }
    }

    .linha-info {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 16px;
    }

    /* Mensagem de status — fonte moderna, maior e bem mais visível. */
    .status {
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 15px;
      font-weight: 500;
      color: #e7e2d4;
      letter-spacing: .3px;
      min-height: 22px;
      opacity: 1;
      transition: opacity .35s ease;
      text-align: left;
      flex: 1;
    }
    .status.fade { opacity: 0; }
    .status .dots { color: #c9a84c; }

    .percent {
      font-family: 'Segoe UI Variable Text', 'Segoe UI', system-ui, sans-serif;
      font-size: 13px;
      font-weight: 600;
      color: #c9a84c;
      font-variant-numeric: tabular-nums;
      min-width: 42px;
      text-align: right;
    }

    /* Aviso da primeira abertura — só aparece quando o main process diz que
       esta é mesmo a primeira abertura depois de instalar/atualizar. */
    .aviso {
      margin-top: 14px;
      font-size: 12px;
      color: #8a8a93;
      max-width: 460px;
      line-height: 1.5;
      opacity: 0;
      transition: opacity .4s ease;
    }
    .aviso.visivel { opacity: 1; }
  </style>
</head>
<body>
  <div class="stage">
    <img class="logo" src="assets/icon.png" alt="JuriX" />
    <div class="title">JURIX</div>
    <div class="subtitle">Sistema Jurídico</div>

    <div class="progress-wrap">
      <div class="bar"><div class="bar-fill" id="barFill"></div></div>
      <div class="linha-info">
        <div class="status" id="statusText">Preparando a papelada<span class="dots">…</span></div>
        <div class="percent" id="percentText">0%</div>
      </div>
      <div class="aviso" id="avisoPrimeira">
        Primeira abertura após a instalação — o Windows ainda está verificando os
        arquivos novos. Pode levar até 1 minuto. Nas próximas vezes abre em segundos.
      </div>
    </div>
  </div>

  <script>
    const statusEl  = document.getElementById('statusText')
    const barEl     = document.getElementById('barFill')
    const pctEl     = document.getElementById('percentText')
    const avisoEl   = document.getElementById('avisoPrimeira')

    // O main process informa, pela query string, se esta é a primeira abertura
    // depois de instalar/atualizar. Só nesse caso o aviso de demora aparece —
    // nas aberturas seguintes o app sobe em segundos e o texto só assustaria.
    const params = new URLSearchParams(location.search)
    const primeiraAbertura = params.get('primeira') === '1'

    if (primeiraAbertura) {
      avisoEl.classList.add('visivel')
    }

    // Duração esperada do boot. Primeira abertura: o antivírus varre os ~700MB
    // recém-gravados e o backend leva 30-45s. Abertura normal: ~6-10s.
    const DURACAO_ESTIMADA_MS = primeiraAbertura ? 45000 : 10000

    // ── Progresso ────────────────────────────────────────────────────────────
    // Duas fontes alimentam a barra e vence sempre a MAIOR:
    //   1. marcos reais reportados pelo main process (window.jurixProgresso)
    //   2. uma estimativa por tempo decorrido, que desacelera e satura em 90%
    // Assim a barra nunca engana dizendo 100% antes da hora, nem fica parada.
    let pctReal = 0        // último marco real recebido
    let pctMostrado = 0    // o que está desenhado (nunca retrocede)

    function estimativaPorTempo(decorridoMs) {
      // Curva que cresce rápido no início e satura: 90 * (1 - e^(-t/τ)).
      const tau = DURACAO_ESTIMADA_MS / 2.2
      return 90 * (1 - Math.exp(-decorridoMs / tau))
    }

    function desenhar(pct) {
      const valor = Math.max(0, Math.min(100, pct))
      if (valor <= pctMostrado) return
      pctMostrado = valor
      barEl.style.width = valor.toFixed(1) + '%'
      pctEl.textContent = Math.round(valor) + '%'
    }

    const inicio = Date.now()
    setInterval(() => {
      desenhar(Math.max(pctReal, estimativaPorTempo(Date.now() - inicio)))
    }, 120)

    // API chamada pelo main process a cada marco real do boot.
    window.jurixProgresso = function (pct, texto) {
      if (typeof pct === 'number' && pct > pctReal) pctReal = pct
      desenhar(pctReal)
      if (texto) {
        mostrar(texto, true)
      }
    }

    // ── Mensagens ────────────────────────────────────────────────────────────
    // Mistura de status reais (o que o app está mesmo fazendo) com "brincadeiras"
    // que qualquer advogado entende — para a espera ser leve.
    const mensagens = [
      'Preparando a papelada',
      'Conectando ao banco de dados',
      'Esquentando o café',
      'Sincronizando com os tribunais (STJ, TJ…)',
      'Organizando os autos',
      'Carregando seus processos',
      'Consultando a jurisprudência',
      'Verificando prazos e intimações',
      'Afiando os argumentos',
      'Separando as petições',
      'Conferindo as movimentações',
      'Batendo o martelo',
    ]

    let idx = 0
    let travadoPeloMain = false  // marco real tem prioridade sobre o rodízio

    function mostrar(texto, doMain = false) {
      if (doMain) travadoPeloMain = true
      statusEl.classList.add('fade')
      setTimeout(() => {
        statusEl.innerHTML = texto + '<span class="dots">…</span>'
        statusEl.classList.remove('fade')
        // Depois de um marco real, volta ao rodízio após alguns segundos.
        if (doMain) setTimeout(() => { travadoPeloMain = false }, 4000)
      }, 350)
    }

    setInterval(() => {
      if (travadoPeloMain) return
      idx = (idx + 1) % mensagens.length
      mostrar(mensagens[idx])
    }, 2100)
  </script>
</body>
</html>
